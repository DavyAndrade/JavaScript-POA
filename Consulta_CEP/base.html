<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta CEP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-semibold text-gray-800 mb-2">Consulta CEP</h1>
            <p class="text-gray-600">Digite seu CEP para consultar o endereço</p>
        </div>

        <!-- Card Principal -->
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <!-- Input CEP -->
            <div class="mb-6">
                <label for="cep" class="block text-sm font-medium text-gray-700 mb-2">CEP</label>
                <div class="relative">
                    <input type="text" id="cep" placeholder="00000-000" maxlength="9"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-lg tracking-wider">
                    <div id="loading" class="absolute right-3 top-3 hidden">
                        <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-500"></div>
                    </div>
                </div>
            </div>

            <!-- Botão Consultar -->
            <button id="consultarBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-6 rounded-lg transition-colors duration-200 mb-6 disabled:bg-gray-400 disabled:cursor-not-allowed"
                disabled>
                Consultar CEP
            </button>

            <!-- Resultado -->
            <div id="resultado" class="hidden">
                <div class="border-t pt-6">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">Endereço Encontrado</h3>
                    <div class="space-y-3">
                        <div class="flex justify-between py-2 border-b border-gray-100">
                            <span class="text-gray-600 font-medium">CEP:</span>
                            <span id="resultCep" class="text-gray-800"></span>
                        </div>
                        <div class="flex justify-between py-2 border-b border-gray-100">
                            <span class="text-gray-600 font-medium">Logradouro:</span>
                            <span id="resultLogradouro" class="text-gray-800 text-right"></span>
                        </div>
                        <div class="flex justify-between py-2 border-b border-gray-100">
                            <span class="text-gray-600 font-medium">Bairro:</span>
                            <span id="resultBairro" class="text-gray-800"></span>
                        </div>
                        <div class="flex justify-between py-2 border-b border-gray-100">
                            <span class="text-gray-600 font-medium">Localidade:</span>
                            <span id="resultLocalidade" class="text-gray-800"></span>
                        </div>
                        <div class="flex justify-between py-2">
                            <span class="text-gray-600 font-medium">UF:</span>
                            <span id="resultUf" class="text-gray-800"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Mensagem de Erro -->
            <div id="erro" class="hidden">
                <div class="bg-red-50 border border-red-200 rounded-lg p-4 text-center">
                    <p class="text-red-600 font-medium">CEP não encontrado</p>
                    <p class="text-red-500 text-sm mt-1">Verifique se o CEP está correto e tente novamente</p>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-6">
            <p class="text-gray-500 text-sm">Powered by ViaCEP API</p>
        </div>
    </div>

    <script>
        const cepInput = document.getElementById('cep');
        const consultarBtn = document.getElementById('consultarBtn');
        const loading = document.getElementById('loading');
        const resultado = document.getElementById('resultado');
        const erro = document.getElementById('erro');

        // Formatação automática do CEP
        cepInput.addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, ''); // Remove tudo que não é número

            if (value.length > 5) {
                value = value.substring(0, 5) + '-' + value.substring(5, 8);
            }

            e.target.value = value;

            // Habilita/desabilita o botão baseado no comprimento
            consultarBtn.disabled = value.replace('-', '').length !== 8;

            // Limpa resultados anteriores
            resultado.classList.add('hidden');
            erro.classList.add('hidden');
        });

        // Permite apenas números
        cepInput.addEventListener('keypress', function (e) {
            if (!/\d/.test(e.key) && !['Backspace', 'Delete', 'Tab', 'Enter'].includes(e.key)) {
                e.preventDefault();
            }
        });

        // Função para consultar CEP
        async function consultarCEP() {
            const cep = cepInput.value.replace(/\D/g, '');

            if (cep.length !== 8) {
                mostrarErro();
                return;
            }

            // Mostra loading
            loading.classList.remove('hidden');
            consultarBtn.disabled = true;
            resultado.classList.add('hidden');
            erro.classList.add('hidden');

            try {
                const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const data = await response.json();

                if (data.erro) {
                    mostrarErro();
                } else {
                    mostrarResultado(data);
                }
            } catch (error) {
                mostrarErro();
            } finally {
                loading.classList.add('hidden');
                consultarBtn.disabled = false;
            }
        }

        function mostrarResultado(data) {
            document.getElementById('resultCep').textContent = data.cep;
            document.getElementById('resultLogradouro').textContent = data.logradouro || 'Não informado';
            document.getElementById('resultBairro').textContent = data.bairro || 'Não informado';
            document.getElementById('resultLocalidade').textContent = data.localidade || 'Não informado';
            document.getElementById('resultUf').textContent = data.uf || 'Não informado';

            resultado.classList.remove('hidden');
            erro.classList.add('hidden');
        }

        function mostrarErro() {
            resultado.classList.add('hidden');
            erro.classList.remove('hidden');
        }

        // Event listeners
        consultarBtn.addEventListener('click', consultarCEP);

        cepInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !consultarBtn.disabled) {
                consultarCEP();
            }
        });
    </script>

</body>

</html>
